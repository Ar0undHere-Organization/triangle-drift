<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Triangle Drift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: single centered 3:2 arena canvas, title above, controls line below. Single dark look by choice (arcade screen). */
:root {
  --bg: #0a0c13;
  --panel: #11141f;
  --grid: #171b2a;
  --fg: #e8ecf5;
  --muted: #7d869c;
  --enemy: #ff4d6a;
  --bullet: #ffd76a;
  --accent: #5ee6d0;
  --font-display: "Space Grotesk", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --font-body: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); }
body {
  color: var(--fg);
  font-family: var(--font-body);
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-family: var(--font-display); font-size: 22px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
header span { color: var(--muted); font-size: 13px; }
.stage { min-width: 0; border: 1px solid var(--grid); border-radius: 4px; overflow: hidden; background: var(--panel); }
canvas { display: block; width: 100%; aspect-ratio: 3 / 2; max-width: 100%; touch-action: none; cursor: crosshair; outline: none; }
.hint { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); font-size: 13px; line-height: 1.6; }
kbd { font-family: var(--font-display); font-size: 12px; padding: 1px 6px; border: 1px solid var(--grid); border-radius: 3px; color: var(--fg); background: var(--panel); }
.net-panel { border: 1px solid var(--grid); background: var(--panel); padding: 12px; display: grid; gap: 9px; }
.net-title { color: var(--accent); font: 700 12px var(--font-display); letter-spacing: .16em; }
.net-controls { display: flex; flex-wrap: wrap; gap: 8px; }
.net-controls input { min-width: 130px; flex: 1 1 180px; border: 1px solid #30384f; border-radius: 3px; padding: 9px 10px; background: #090d17; color: var(--fg); font: inherit; }
.net-controls button { border: 1px solid #3d7e78; border-radius: 3px; padding: 9px 14px; background: #12302f; color: var(--accent); font: 700 13px var(--font-body); cursor: pointer; }
.net-controls button:hover { background: #1b4542; }
#netStatus { color: var(--muted); font-size: 12px; min-height: 1.4em; }
.stage { position: relative; }
.screen-layer { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 18px; overflow: auto; background: rgba(5, 8, 15, .78); }
.screen-layer[hidden] { display: none; }
.screen-panel { width: min(460px, 100%); max-height: 100%; overflow: auto; border: 1px solid #37405b; border-radius: 4px; padding: 22px; background: rgba(13, 18, 30, .96); box-shadow: 0 18px 60px rgba(0,0,0,.4); }
.screen-kicker { color: var(--accent); font: 700 11px var(--font-display); letter-spacing: .14em; }
.screen-panel h2 { margin: 8px 0 6px; font: 700 27px var(--font-display); }
.screen-copy { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
.screen-actions { display: grid; gap: 9px; }
.screen-actions button { min-height: 42px; border: 1px solid #3d7e78; border-radius: 3px; padding: 9px 14px; background: #12302f; color: var(--accent); font: 700 14px var(--font-body); cursor: pointer; }
.screen-actions button:hover:not(:disabled) { background: #1b4542; }
.screen-actions button:disabled { opacity: .4; cursor: not-allowed; }
.screen-actions .secondary { border-color: #394157; background: #171d2b; color: var(--fg); }
.screen-fields { display: grid; gap: 8px; margin-top: 12px; }
.screen-fields input { min-width: 0; width: 100%; border: 1px solid #30384f; border-radius: 3px; padding: 10px; background: #090d17; color: var(--fg); font: inherit; }
.screen-join { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.screen-join button { min-height: 40px; border: 1px solid #394157; border-radius: 3px; padding: 8px 12px; background: #171d2b; color: var(--fg); font: 700 13px var(--font-body); cursor: pointer; }
.screen-status { min-height: 1.4em; margin: 12px 0 0; color: var(--muted); font-size: 12px; }
.room-code { margin: 12px 0; color: var(--accent); font: 700 24px var(--font-display); letter-spacing: .12em; }
.lobby-list { display: grid; gap: 5px; margin: 12px 0 16px; padding: 0; list-style: none; }
.lobby-list li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid #252b3d; padding: 7px 2px; color: var(--fg); font-size: 13px; }
.lobby-list .lobby-state { color: var(--muted); }
@media (max-width: 520px) { .screen-panel { padding: 16px; } .screen-panel h2 { font-size: 23px; } }
</style>

<div class="wrap">
  <header>
    <h1>Triangle Drift</h1>
    <span>ローグライクシューター プロトタイプ</span>
  </header>
  <div class="stage">
    <canvas id="cv" tabindex="0" aria-label="ゲーム画面"></canvas>
    <section id="mainMenu" class="screen-layer" aria-label="メインメニュー">
      <div class="screen-panel">
        <div class="screen-kicker">TRIANGLE DRIFT / ARCADE</div>
        <h2>メインメニュー</h2>
        <p class="screen-copy">プレイ人数 1 - 8 人</p>
        <div class="screen-fields"><label for="dashModeSelect">ダッシュ方向</label><select id="dashModeSelect" aria-label="ダッシュ方向"><option value="mouse">マウス方向</option><option value="move">移動方向</option></select></div>
        <div class="screen-fields"><label><input id="bloomToggle" type="checkbox" checked> ブルーム</label><label><input id="trailToggle" type="checkbox" checked> 軌道表示</label></div>
        <div class="screen-actions"><button id="soloStart">ソロで始める</button><button id="createRoom" class="secondary">マルチプレイを作成</button></div>
        <div class="screen-fields">
          <input id="playerName" type="text" maxlength="16" placeholder="プレイヤー名" aria-label="プレイヤー名">
          <input id="serverUrl" type="url" placeholder="サーバーURL (例: https://your-game-server.example)" aria-label="サーバーURL">
          <div class="screen-join"><input id="roomCode" type="text" maxlength="6" placeholder="ルームコード" aria-label="ルームコード"><button id="joinRoom">参加</button></div>
        </div>
        <p id="netStatus" class="screen-status" role="status">ソロプレイ / オンライン接続待機中</p>
      </div>
    </section>
    <section id="lobbyScreen" class="screen-layer" aria-label="マルチプレイ待機室" hidden>
      <div class="screen-panel">
        <div class="screen-kicker">ONLINE CO-OP / 8 PLAYERS</div>
        <h2>マルチプレイ待機室</h2>
        <p id="lobbyCode" class="room-code"></p>
        <ol id="lobbyPlayers" class="lobby-list" aria-label="参加者"></ol>
        <div class="screen-actions"><button id="startRoom">ゲーム開始</button><button id="leaveRoom" class="secondary">退出</button></div>
        <p id="lobbyStatus" class="screen-status" role="status">参加者を待っています</p>
      </div>
    </section>
  </div>
  <div class="hint">
    <span>移動 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 矢印キー</span>
    <span>射撃 マウス左クリック長押し</span>
    <span>ダッシュ マウス右クリック(移動方向)</span>
    <span>アップグレード選択 クリック or <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd></span>
  </div>
</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
(function () {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 960, H = 640;
  const TAU = Math.PI * 2;
  const C = { bg: '#0a0c13', grid: '#171b2a', fg: '#e8ecf5', muted: '#7d869c', enemy: '#ff4d6a', bullet: '#ffd76a', accent: '#5ee6d0' };
  const FONT = '"Space Grotesk","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif';

  /* ---------- enemy types ---------- */
  const ET = {
    tri: { sides: 3, r: 18, vr: 1.15, color: C.enemy, fill: '#2a0f1a' },
    sq: { sides: 4, r: 20, vr: 1.1, color: '#ff9f43', fill: '#2b1a0a' },
    pent: { sides: 5, r: 23, vr: 1.05, color: '#b784ff', fill: '#1d1230' },
    // boss: Stardust (4-pointed star). hk = hit-radius multiplier
    stardust: { sides: 8, star: true, r: 46, vr: 1.15, color: '#ffe36e', fill: '#2a2408', hk: 0.85, boss: true, name: 'STARDUST' },
    // boss: Trinity (3つの三角形。合体⇄分離を繰り返す)。sy = 出現Y座標
    trinity: { sides: 3, r: 32, vr: 1.15, color: '#ff5cf0', fill: '#2a0f29', hk: 0.85, boss: true, name: 'TRINITY', sy: 270 },
    // boss: Train(部位破壊・分裂するワーム状ボス。各車両が個別HP)。seg = 複数パーツ型
    train: { sides: 4, r: 19, vr: 1, color: '#c3d0e0', fill: '#1b2230', boss: true, seg: true, name: 'TRAIN' },
    hex: { sides: 6, r: 26, vr: 1.05, color: '#4ddcff', fill: '#0b2a33', mass: 3 },
    // エリート三角形(大型。倒すと通常三角形3体に分裂)
    etri: { sides: 3, r: 30, vr: 1.15, color: '#ff3d8a', fill: '#33101f', mass: 2 },
    // エリート五角形(五角形より少し大きい。3way弾を撃つ)
    epent: { sides: 5, r: 27, vr: 1.05, color: '#d98cff', fill: '#25103a', mass: 2 },
    // 回復十字(回転。周囲の十字以外の敵を一定間隔で回復)
    cross: { cross: true, sides: 12, r: 20, vr: 1.15, color: '#6cff8f', fill: '#0e2a18' },
    hexstar: { star: true, sides: 12, r: 25, vr: 1.05, color: '#72aaff', fill: '#101e3a', hk: 0.9 }
  };
  const isTri = (t) => t === 'tri' || t === 'etri';
  const CROSS_R = 140, CROSS_INTERVAL = 2.6, CROSS_HEAL = 0.2;      // 回復範囲 / 間隔(秒) / 最大HPに対する回復割合
  const BOSS_COL = '#ffe36e', BOUNCE_COL = '#7ad7ff';
  const BOSS_EVERY = 10;
  const BOSS_ORDER = ['stardust', 'trinity', 'train'];   // ボスの出現順(循環)。ボスを追加したらここに並べる
  const bossHp = () => 620 + Math.max(0, Math.floor(Math.max(1, wave) / BOSS_EVERY) - 1) * 520;

  /* ---------- canvas sizing ---------- */
  let scale = 1, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const cw = cv.clientWidth || W;
    scale = cw / W;
    cv.width = Math.round(cw * dpr);
    cv.height = Math.round(cw * (H / W) * dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- audio ---------- */
  let ac = null;
  function initAudio() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function tone(f, d, type, v, slideTo, delay) {
    if (!ac) return;
    try {
      const t = ac.currentTime + (delay || 0);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + d);
      g.gain.setValueAtTime(v || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  }
  const sfx = {
    shoot() { tone(680 + Math.random() * 80, 0.07, 'square', 0.025, 220); },
    hit() { tone(240, 0.06, 'triangle', 0.05, 120); },
    kill() { tone(320, 0.22, 'sawtooth', 0.06, 40); tone(900, 0.08, 'square', 0.03, 300); },
    hurt() { tone(160, 0.3, 'sawtooth', 0.09, 40); },
    eshoot() { tone(420, 0.12, 'sawtooth', 0.025, 180); },
    spawn() { tone(110 + Math.random() * 30, 0.16, 'triangle', 0.05, 220); },
    clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.06, 0, i * 0.09)); },
    pick() { tone(440, 0.1, 'square', 0.05, 880); tone(880, 0.18, 'triangle', 0.05, 1320, 0.08); },
    hover() { tone(1200, 0.03, 'sine', 0.02); },
    start() { [330, 440, 660].forEach((f, i) => tone(f, 0.15, 'square', 0.04, 0, i * 0.07)); },
    over() { tone(220, 0.9, 'sawtooth', 0.09, 30); tone(110, 1.1, 'square', 0.06, 25, 0.1); },
    wave() { tone(196, 0.3, 'triangle', 0.06, 392); },
    boss() { [110, 98, 82].forEach((f, i) => tone(f, 0.5, 'sawtooth', 0.07, f * 0.6, i * 0.18)); },
    bossCall() { tone(520, 0.22, 'sawtooth', 0.03, 260); },
    meteor() { tone(1500, 0.3, 'sine', 0.025, 300); },
    impact() { tone(150, 0.2, 'triangle', 0.06, 50); },
    heal() { tone(520, 0.18, 'sine', 0.04, 880); },
    dash() { tone(260, 0.16, 'sawtooth', 0.04, 1000); }
  };
  // ホスト: 効果音はゲストの画面でも鳴らすため演出イベントとして転送する(UI専用の音は除外)
  Object.keys(sfx).forEach((k) => {
    if (k === 'hover' || k === 'pick' || k === 'start') return;
    const f = sfx[k];
    sfx[k] = function () { f.apply(null, arguments); pushEv(['s', k]); };
  });

  /* ---------- upgrades ---------- */
  const BASE_DELAY = 0.28;
  const DASH_DUR = 0.2, DASH_SPEED = 900, DASH_CD = 1.0;   // ダッシュ(右クリック): 時間 / 速度 / ダッシュ後のクールダウン
  const PHASE_MIN = 20, PHASE_MAX = 30;        // 1フェーズは原則20〜30体。余りは均等配分
  const DMG_BASE = 20, HP_SCALE = 20;          // 弾の基本ダメージ / 敵HPの倍率(旧: ダメージ1・HPそのまま)
  const ITEM_DROP = 0.15, ITEM_HEAL = 10;      // 十字撃破時の回復アイテム: ドロップ率 / 回復量
  function upgradeValue(id, pl) {
    const s = pl.S;
    switch (id) {
      case 'rate': return [s.fireDelay.toFixed(2) + '秒', (BASE_DELAY / (s.rate + 0.15)).toFixed(2) + '秒'];
      case 'dmg': return [s.dmg + '', (s.dmg + DMG_BASE) + ''];
      case 'multi': return [formatChance(s.shots), formatChance(s.shots + 0.5)];
      case 'speed': return [Math.round(s.bspeed) + '', (Math.round(s.bspeed + 62)) + ''];
      case 'pierce': return [formatChance(s.pierce), formatChance(s.pierce + 0.5)];
      case 'homing': return [s.guideLevel + '段階', (s.guideLevel + 1) + '段階'];
      case 'burst': return [s.burstLv ? 'Lv ' + s.burstLv : 'なし', 'Lv ' + (s.burstLv + 1)];
      case 'ricochet': return [formatChance(s.ric), formatChance(s.ric + 0.5)];
      case 'crit': return [formatPercent(s.critChance), formatPercent(s.critChance + 0.05)];
      case 'critdmg': return [formatPercent(s.critDmg - 1), formatPercent(s.critDmg + 0.25 - 1)];
      case 'size': return [s.bsize.toFixed(1), (s.bsize + 0.45).toFixed(1)];
      case 'move': return [pl.speed + '', (pl.speed + 25) + ''];
      case 'armor': return [pl.maxHp + ' / ' + Math.ceil(pl.hp) + ' HP', (pl.maxHp + 20) + ' / ' + Math.min(pl.maxHp + 20, Math.ceil(pl.hp) + 20) + ' HP'];
      case 'heal': return [Math.ceil(pl.hp) + ' / ' + pl.maxHp + ' HP', Math.min(pl.maxHp, Math.ceil(pl.hp) + 40) + ' / ' + pl.maxHp + ' HP'];
      default: return ['-', '-'];
    }
  }
  function formatChance(v) { const n = Math.floor(v) + (v % 1 >= 0.5 ? 1 : 0); return (n * 100 + Math.round((v % 1) * 100)) + '%相当'; }
  function formatPercent(v) { return Math.round(v * 100) + '%'; }
  const UPG = [
    { id: 'rate', name: '連射強化', desc: '時間あたりの攻撃回数 +15%', color: '#ffd76a', apply: (s) => { s.rate += 0.15; s.fireDelay = BASE_DELAY / s.rate; } },
    { id: 'dmg', name: '火力強化', desc: '弾のダメージ +' + DMG_BASE, color: '#ff7a59', apply: (s) => { s.dmg += DMG_BASE; } },
    { id: 'multi', name: 'マルチショット', desc: '同時発射チャンス +50%(弾数に応じて威力減衰)', color: '#c49bff', weight: 0.35, apply: (s) => { s.shots += 0.5; } },
    { id: 'speed', name: '高速弾', desc: '弾速 +10% / ノックバック微増', color: '#6ec5ff', apply: (s) => { s.bspeed += 62; s.kb += 0.3; } },
    { id: 'pierce', name: '貫通弾', desc: '敵貫通チャンス +50%(100%ごとに必ず1回貫通)', color: '#5ee6d0', weight: 0.35, apply: (s) => { s.pierce += 0.5; } },
    { id: 'homing', name: '誘導弾', desc: '誘導性能が上昇 (強化ごとの伸び幅は減衰)', color: '#ff9b55', weight: 0.7, apply: (s) => { s.guideLevel += 1; s.missileHoming = true; } },
    { id: 'burst', name: '炸裂弾', desc: '着弾・貫通時に攻撃力20%の範囲ダメージ(直撃した敵にも入る)。強化でダメージ +4%。範囲は弾サイズに比例', color: '#ff8a3d', apply: (s) => { s.burstLv += 1; } },
    { id: 'ricochet', name: '反射弾', desc: '壁で跳ね返る確率 +50%(100%ごとに必ず1回跳ね返る)', color: '#a0e7ff', weight: 0.35, apply: (s) => { s.ric += 0.5; } },
    { id: 'crit', name: 'クリティカル率強化', desc: 'クリティカル率 +5%(100%ごとに必ず1重のクリティカル)', color: '#ffe36e', apply: (s) => { s.critChance += 0.05; } },
    { id: 'critdmg', name: 'クリティカルダメージ強化', desc: 'クリティカルダメージ +25%(基本 200%)', color: '#ffc14d', apply: (s) => { s.critDmg += 0.25; } },
    { id: 'size', name: '大口径', desc: '弾のサイズ +10%(炸裂範囲も拡大)', color: '#ffa8d1', apply: (s) => { s.bsize += 0.45; } },
    { id: 'move', name: 'スラスター', desc: '移動速度 +10%', color: '#9be564', apply: (s, p) => { p.speed += 25; } },
    { id: 'armor', name: '装甲強化', desc: '最大体力 +20 / 体力 +20 回復', color: '#ff8fa0', apply: (s, p) => { p.maxHp += 20; p.hp = Math.min(p.maxHp, p.hp + 20); } },
    { id: 'heal', name: '応急修復', desc: '体力を 40 回復する', color: '#7df0a8', apply: (s, p) => { p.hp = Math.min(p.maxHp, p.hp + 40); } }
  ];

  /* ---------- state ---------- */
  let state = 'title';          // title | play | clear | upgrade | dying | over
  let P, enemies, bullets, ebullets, parts, rings, spawns, texts, meteors, items, trainZones;
  const COLLISION_CELL = 96;
  let enemyGrid = new Map();
  const LIMITS = { parts: 800, rings: 120, texts: 160, bullets: 240, ebullets: 800, trainZones: 100 };
  let wave = 0, kills = 0, time = 0;
  let phaseIdx = 0, phaseCount = 1, wavePhases = [];     // ウェーブ内フェーズ
  let trainCid = 1;                                      // Train のチェーンID採番
  const trainMap = new Map();
  let shake = 0, hurtFlash = 0, bannerT = 0, bannerText = '', clearT = 0, dyT = 0, upT = 0, overT = 0, pickFlash = 0;
  let bannerCol = '#ffe36e';
  let hoverIdx = -1, myPickIdx = -1;
  const keys = {};
  let guestDash = false;
  let dashMode = 'mouse';
  let bloomEnabled = true, trailEnabled = true;
  const mouse = { x: W / 2, y: H / 2, down: false };
  let netSocket = null, netRole = 'solo', netRoom = '', peerConnected = false;
  const MAX_PLAYERS = 8;
  const PLAYER_COLORS = ['#ffffff', '#5ee6d0', '#ffbd69', '#e68cff', '#8ee06c', '#ff7a86', '#72b7ff', '#f4e66a'];
  let playerId = 1, roomRoster = [{ playerId: 1, isHost: true, name: 'P1' }];
  let playerName = 'P1';
  const freshRemoteInput = () => ({ has: false, x: W / 2 + 45, y: H / 2, aimX: W / 2, aimY: H / 2, firing: false, dashT: 0, dashCd: 0 });
  let remotePlayer = null, lastNetSend = 0, lastInputAt = 0, lastSnapshotAt = 0, netConnected = false;
  let remotePlayers = new Map(), remoteInputs = new Map(), remoteCursors = new Map(), remotePickStates = new Map();
  /* --- 通信まわりの共通状態 ---

  function resetRun() {

  function beginWave(n) {
    wave = n; state = 'play';
    bannerT = 1.8; bannerText = 'WAVE ' + n;
    bullets.length = 0; ebullets.length = 0; meteors.length = 0; items.length = 0; trainZones.length = 0;
    if (n % BOSS_EVERY === 0) {

      const bt = BOSS_ORDER[bossIndex % BOSS_ORDER.length];
      bannerText = 'BOSS  ' + ET[bt].name; bannerCol = ET[bt].color;
      phaseIdx = 0; phaseCount = 1; wavePhases = [];
      if (bt === 'train') {                              // 画面端の予告レーンから進入
        const edge = Math.floor(Math.random() * 4);       // 0:左→右 1:右→左 2:上→下 3:下→上
        const lx = 160 + Math.random() * (W - 320), ly = 120 + Math.random() * (H - 240);
        spawns = [{ x: edge === 0 ? 0 : edge === 1 ? W : lx, y: edge === 2 ? 0 : edge === 3 ? H : ly, t: 0, delay: 2.6, type: bt, edge }];
      } else {
        spawns = [{ x: W / 2, y: ET[bt].sy || 175, t: 0, delay: 1.6, type: bt }];
      }
      sfx.boss();
      return;
    }
    const count = Math.min(8 + (n - 1) * 3, 120);
    const nP = n >= 6 ? Math.min(1 + Math.floor((n - 6) / 2), 6) : 0;
    const nS = n >= 3 ? Math.min(1 + Math.floor((n - 3) / 2), 8) : 0;
    const types = [];
    for (let i = 0; i < nP; i++) types.push('pent');
    for (let i = 0; i < nS; i++) types.push('sq');
    const nH = n >= 8 ? Math.min(1 + Math.floor((n - 8) / 3), 4) : 0;
    for (let i = 0; i < nH; i++) types.push('hex');
    const nE = n >= 10 ? Math.min(1 + Math.floor((n - 10) / 3), 4) : 0;   // エリート三角形は序盤には出さない
    for (let i = 0; i < nE; i++) types.push('etri');
    const nEP = n >= 12 ? Math.min(1 + Math.floor((n - 12) / 4), 3) : 0;  // エリート五角形は序盤には出さない
    for (let i = 0; i < nEP; i++) types.push('epent');

    for (let i = 0; i < nX; i++) types.push('cross');

  function farFromPlayers(x, y) {
    if (Math.hypot(x - P.x, y - P.y) <= 170) return false;

    return true;
  }
  function startPhase(idx) {
    const list = wavePhases[idx], cnt = list.length, stagger = Math.min(0.2, 3.2 / cnt);
    spawns = [];

      let x, y, ok, tries = 0;
      do {
        x = 70 + Math.random() * (W - 140);
        y = 70 + Math.random() * (H - 140);
        ok = farFromPlayers(x, y) && spawns.every((s) => Math.hypot(s.x - x, s.y - y) > 64);
        tries++;

    }
  }

  function startGame() {

  }

  /* ---------- fx helpers ---------- */
  function burst(x, y, n, color, speed, life, size) {
    pushEv(['b', r1(x), r1(y), n, color, speed, life, size]);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, v = speed * (0.35 + Math.random() * 0.8);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.6 + Math.random() * 0.6), max: life, size: size * (0.6 + Math.random() * 0.8), color });
    }
    if (parts.length > LIMITS.parts) parts.splice(0, parts.length - LIMITS.parts);
  }
  function ring(x, y, maxR, life, color, lw) { if (!trailEnabled && maxR < 80) return; pushEv(['r', r1(x), r1(y), maxR, life, color, lw || 2]); rings.push({ x, y, r: 0, maxR, life, max: life, color, lw: lw || 2 }); if (rings.length > LIMITS.rings) rings.shift(); }
  function floatText(x, y, str, color) { pushEv(['t', r1(x), r1(y), str, color]); texts.push({ x, y, str, color, life: 0.7, max: 0.7 }); if (texts.length > LIMITS.texts) texts.shift(); }
  const fmtNum = (v) => String(Math.round(v * 10) / 10);

  /* ---------- gameplay ---------- */
  function keyDir() {                                // 現在の移動入力(正規化)
    let dx = 0, dy = 0;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (keys['w'] || keys['arrowup']) dy -= 1;

  // 右クリック: 無敵ダッシュ(現在の移動方向。入力が無ければ直前の移動方向、それも無ければカーソル方向)
  function tryDash(pl, dx, dy, ax, ay) {
    if (!pl || pl.hp <= 0 || pl.dashT > 0 || pl.dashCd > 0 || (state !== 'play' && state !== 'clear')) return;
    let ux, uy; const m = Math.hypot(dx, dy);
    if (dashMode === 'move' && m > 0.01) { ux = dx / m; uy = dy / m; }
    else if (dashMode === 'move' && (pl.lx || pl.ly)) { ux = pl.lx; uy = pl.ly; }
    else if (dashMode === 'mouse') { const ex = ax - pl.x, ey = ay - pl.y, d = Math.hypot(ex, ey); if (d > 1) { ux = ex / d; uy = ey / d; } else { ux = 1; uy = 0; } }
    else if (pl.lx || pl.ly) { ux = pl.lx; uy = pl.ly; }
    else { const ex = ax - pl.x, ey = ay - pl.y, d = Math.hypot(ex, ey); if (d > 1) { ux = ex / d; uy = ey / d; } else { ux = 1; uy = 0; } }

  function updateDash(pl, dt) {

      pl.x = Math.max(pl.r + 6, Math.min(W - pl.r - 6, pl.x)); pl.y = Math.max(pl.r + 6, Math.min(H - pl.r - 6, pl.y));

  function fire() { fireFrom(P, mouse.x, mouse.y); }
  function fireFrom(shooter, aimX, aimY) {

    let a = Math.atan2(aimY - shooter.y, aimX - shooter.x);
    const n = Math.floor(S.shots) + (Math.random() < S.shots % 1 ? 1 : 0);
    const shotDamage = S.dmg / Math.sqrt(n);
    for (let i = 0; i < n; i++) {

  function killEnemy(e) {
    kills++;
    const et = ET[e.type];
    const sm = e.type === 'tri';
    burst(e.x, e.y, sm ? 18 : 26, et.color, 320, 0.6, 3.4);
    burst(e.x, e.y, 8, '#ffffff', 220, 0.35, 2.4);

    if (e.type === 'hex' && !e.silent) hexShoot(e);          // 六角形: 倒したときだけ三段の12方向へ弾
    if (e.type === 'etri' && !e.silent) splitElite(e);       // エリート三角形: 通常三角形3体に分裂
    const lastSeg = !et.seg || !enemies.some((o) => o !== e && o.type === e.type && o.hp > 0);

      burst(e.x, e.y, 90, et.color, 560, 1.0, 4.5);

  function hurtPlayer(amount, fromX, fromY) {
    if (P.hp <= 0) return;
    P.hp -= amount; P.inv = 0.75;
    const a = Math.atan2(P.y - fromY, P.x - fromX);
    P.kx += Math.cos(a) * 380; P.ky += Math.sin(a) * 380;

    ring(P.x, P.y, 58, 0.3, '#ff5d6a', 3);
    floatText(P.x, P.y - 34, '-' + amount, '#ff7a86');
    sfx.hurt();
    if (P.hp <= 0) {
      P.hp = 0;
      if (!partyPlayers().some((pl) => pl.hp > 0)) state = 'dying';
      if (state === 'dying') dyT = 1.2;
      burst(P.x, P.y, 60, '#ffffff', 520, 1.0, 4);
      burst(P.x, P.y, 30, '#ff5d6a', 420, 1.1, 4);
      ring(P.x, P.y, 220, 0.9, '#ffffff', 4);
      ring(P.x, P.y, 140, 0.7, '#ff5d6a', 3);

  function hurtRemotePlayer(rp, amount, fromX, fromY) {
    if (!rp || rp.inv > 0 || rp.hp <= 0) return;
    rp.hp -= amount; rp.inv = 0.75;
    const a = Math.atan2(rp.y - fromY, rp.x - fromX);
    pushEv(['k', rp.id, r1(Math.cos(a) * 380), r1(Math.sin(a) * 380), 1]);
    shake = Math.max(shake, 8);
    burst(rp.x, rp.y, 14, '#5ee6d0', 280, 0.45, 3);
    ring(rp.x, rp.y, 58, 0.3, '#5ee6d0', 3);
    floatText(rp.x, rp.y - 34, '-' + amount, '#5ee6d0');
    sfx.hurt();
    if (rp.hp <= 0) {
      rp.hp = 0;
      burst(rp.x, rp.y, 50, '#ffffff', 480, 0.9, 4);
      burst(rp.x, rp.y, 26, '#5ee6d0', 400, 1.0, 4);
      ring(rp.x, rp.y, 200, 0.8, '#ffffff', 4);
      if (!partyPlayers().some((pl) => pl.hp > 0)) { state = 'dying'; dyT = 1.2; sfx.over(); }
    }
  }

  function getTargetPlayer(x, y) {
    const candidates = partyPlayers();
    const alive = candidates.filter(p => p.hp > 0);
    return alive.sort((a, b) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y))[0] || P;
  }

  function enemyShoot(e) {

  /* ---------- boss: Stardust ---------- */

  /* ---------- boss: Trinity ---------- */
  // 3つの三角形。合体(中央で回転しながら3方向レーザー＋各三角形から3方向弾) ⇄ 分離(距離を取り、順番に3way弾×3連射)
  const TRI_WARN = 1.2, TRI_ACT = 4.4, TRI_SPLIT_T = 0.9, TRI_MERGE_T = 1.0, TRI_OFS = ET.trinity.r * ET.trinity.vr;   // 重心までの距離=三角形の外接円半径 → 頂点が隣と一致(トライフォース配置)
  const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

  function initTrinity(e) {

  function trinityBullet(x, y, a, sp, r) {

  }
  function trinitySpiral(e, tk) {                       // 合体: 各三角形から3方向(計9方向)
    for (let i = 0; i < 3; i++) {
      const p = e.parts[i];
      for (let k = 0; k < 3; k++) {
        const a = e.la + TAU / 6 + i * TAU / 9 + k * TAU / 3;

  function trinitySplitAttack(e, p, tk) {

    const fire = (a, speed) => trinityBullet(p.x + Math.cos(a) * e.r, p.y + Math.sin(a) * e.r, a, speed * tk, 5);
    if (mode === 0) for (let i = -2; i <= 2; i++) fire(aim + i * 0.4, 145);
    else if (mode === 1) for (let i = -1; i <= 1; i++) fire(aim + i * 0.24, 165);

  function trinityBeamHit(e) {                          // レーザー判定
    const cands = partyPlayers().filter((pl) => pl.hp > 0 && pl.inv <= 0 && (pl !== P || state !== 'dying'));
    for (const pl of cands) {

  function updateTrinity(e, dt) {

    if (state === 'dying') { e.beam = 0; centroid(); return; }
    const tier = Math.min(Math.max(1, Math.floor(wave / BOSS_EVERY)) - 1, 4), tk = 1 + tier * 0.06;

    }

      if (e.ft < TRI_WARN) { e.beam = 1; e.bp = e.ft / TRI_WARN; }

        if (e.vT <= 0) { trinitySpiral(e, tk); e.vT = e.p2 ? 0.5 : 0.64; }

        e.form = 'splitting'; e.ft = 0; e.beam = 0; e.phi = e.la; e.turn = 0; e.sStage = 0; e.sT = 0;

        const q = parts[i], a = e.phi + i * TAU / 3;
        chase(q, W / 2 + Math.cos(a) * 300, H / 2 + Math.sin(a) * 185, fast ? 4 : 2.4, fast ? 460 : (e.p2 ? 320 : 260), dt);
        const dx = q.x - pl.x, dy = q.y - pl.y, d = Math.hypot(dx, dy) || 1;     // プレイヤーから距離を取る
        if (d < 170) { const k = (170 - d) * Math.min(1, dt * 3.5); q.x += dx / d * k; q.y += dy / d * k; }
      }
      for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) {                // 三角形同士も距離を取る
        const a = parts[i], b = parts[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
        if (d < 220) { const k = (220 - d) * 0.5 * Math.min(1, dt * 3); a.x -= dx / d * k; a.y -= dy / d * k; b.x += dx / d * k; b.y += dy / d * k; }
      }
      const m = e.r * 1.2;
      for (const q of parts) { q.x = Math.max(m, Math.min(W - m, q.x)); q.y = Math.max(m, Math.min(H - m, q.y)); }
      parts.forEach((q, i) => {                                                    // 発射準備中〜発射中はプレイヤーへ先端を向ける

      }

  /* ---------- 敵同士の反発 ---------- */
  function separate(dt) {
    const grid = new Map();
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const cx = Math.floor((e.bx || e.x) / COLLISION_CELL), cy = Math.floor((e.by || e.y) / COLLISION_CELL);
      const key = cx + ',' + cy;
      if (!grid.has(key)) grid.set(key, []);
      grid.get(key).push(e);
    }
    const checked = new Set();
    for (const [key, bucket] of grid) {
      const [cx, cy] = key.split(',').map(Number);
      for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
        const neighbors = grid.get((cx + ox) + ',' + (cy + oy));
        if (!neighbors) continue;
        for (const a of bucket) for (const b of neighbors) {
          if (a === b) continue;
          const pair = a.id && b.id ? (a.id < b.id ? a.id + ':' + b.id : b.id + ':' + a.id) : a + ':' + b;
          if (checked.has(pair)) continue;
          checked.add(pair);
          const tot = a.inv + b.inv;
          if (tot === 0) continue;
          let dx = b.bx - a.bx, dy = b.by - a.by, d = Math.hypot(dx, dy);
          const min = (a.r + b.r) * 0.95;
          if (d >= min) continue;
          if (d < 0.01) { const g = Math.random() * TAU; dx = Math.cos(g); dy = Math.sin(g); d = 1; }
          const push = (min - d) * Math.min(1, dt * 13), ux = dx / d, uy = dy / d;
          a.bx -= ux * push * a.inv / tot; a.by -= uy * push * a.inv / tot;
          b.bx += ux * push * b.inv / tot; b.by += uy * push * b.inv / tot;
        }
      }
    }
    for (const e of enemies) {
      if (!e.inv) continue;
      const m = e.r + 8;
      e.bx = Math.max(m, Math.min(W - m, e.bx)); e.by = Math.max(m, Math.min(H - m, e.by));
    }
  }
  function spawnEnemy(type, x, y, quiet, summoned) {

  /* ---------- boss: Train (部位破壊で分裂するワーム) ---------- */
  const TRAIN_LEN = 22, TRAIN_GAP = 34, TRAIN_SPEED = 150, TRAIN_ENTRY = 260;
  function spawnTrain(sp) {

  // 複数パーツを持つ敵(Trinity)用の当たり判定ヘルパー

  function drawEnemies() {

      ctx.restore();
    }
  }


  function drawLasers() {                                   // Trinity と六芳星のレーザー(予告線→照射)
    for (const e of enemies) {
      if (e.type === 'hexstar' && e.laserPhase > 0) {
        const ex = e.x + Math.cos(e.laserAngle) * 1300, ey = e.y + Math.sin(e.laserAngle) * 1300;
        ctx.save(); ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(ex, ey);
        ctx.lineCap = 'round';
        if (e.laserPhase === 1) { ctx.strokeStyle = '#72aaff'; ctx.lineWidth = 2; ctx.setLineDash([12, 10]); ctx.lineDashOffset = -time * 80; ctx.globalAlpha = 0.45 + 0.35 * (Math.sin(time * 20) + 1) * 0.5; ctx.stroke(); }
        else { ctx.globalCompositeOperation = 'lighter'; ctx.shadowColor = '#72aaff'; ctx.shadowBlur = 20; ctx.strokeStyle = '#72aaff'; ctx.lineWidth = 20; ctx.globalAlpha = 0.35; ctx.stroke(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5; ctx.globalAlpha = 0.9; ctx.stroke(); }
        ctx.restore(); continue;
      }
      if (e.type !== 'trinity' || !e.beam) continue;
      const col = ET.trinity.color;
      ctx.save();
      for (let i = 0; i < 3; i++) {
        const a = e.la + i * TAU / 3, ex = e.cx + Math.cos(a) * 1300, ey = e.cy + Math.sin(a) * 1300;
        ctx.beginPath(); ctx.moveTo(e.cx, e.cy); ctx.lineTo(ex, ey);

  function drawItems() {

    }
  }

  function drawMeteors() {
    for (const m of meteors) {
      if (m.t < 0) continue;
      ctx.save();
      if (m.t < m.warn) {                           // 着弾予告
        const p = m.t / m.warn;
        const blink = p > 0.6 ? (Math.floor(m.t * 16) % 2 ? 1 : 0.5) : 1;
        ctx.globalAlpha = (0.35 + 0.5 * p) * blink;
        ctx.strokeStyle = BOSS_COL; ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]); ctx.lineDashOffset = -m.t * 40;
        ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha *= 0.3;
        ctx.fillStyle = BOSS_COL;
        ctx.beginPath(); ctx.arc(m.x, m.y, m.r * p, 0, TAU); ctx.fill();
      } else {                                      // 落下
        const p = Math.min(1, (m.t - m.warn) / m.fall), e = p * p;
        const sx = m.x + 240, sy = m.y - 560;
        const hx = sx + (m.x - sx) * e, hy = sy + (m.y - sy) * e;
        const e0 = Math.max(0, e - 0.35);
        const tx = sx + (m.x - sx) * e0, ty = sy + (m.y - sy) * e0;
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(255,227,110,.5)'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(tx + (hx - tx) * 0.4, ty + (hy - ty) * 0.4); ctx.lineTo(hx, hy); ctx.stroke();
        ctx.shadowColor = BOSS_COL; ctx.shadowBlur = 16; ctx.fillStyle = '#ffffff';
        drawStar(hx, hy, 14, time * 10, 0.4); ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawBullets() {

      ctx.beginPath(); ctx.moveTo(b.px - b.vx * 0.012, b.py - b.vy * 0.012); ctx.lineTo(b.x, b.y); ctx.stroke();

  function drawPlayer() {
    if (state !== 'dying' && state !== 'over') {
      for (const player of visiblePlayers()) if (player.hp > 0) drawOnePlayer(player, player.color || playerColor(player.id || 1));
    }
  }

    ctx.save(); ctx.globalAlpha = 0.8; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 8, 0, TAU); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(x - 12, y); ctx.lineTo(x - 5, y); ctx.moveTo(x + 5, y); ctx.lineTo(x + 12, y); ctx.moveTo(x, y - 12); ctx.lineTo(x, y - 5); ctx.moveTo(x, y + 5); ctx.lineTo(x, y + 12); ctx.stroke(); ctx.restore();
  }

  }
  function drawOnePlayer(player, color) {
    // ホスト画面のゲスト機は、届いた位置を平滑化した座標(sx, sy)で描く
    const dp = (netRole === 'host' && player !== P) ? Object.assign({}, player, { x: player.sx, y: player.sy }) : player;
    if (coop()) {
      ctx.save(); ctx.fillStyle = color; ctx.globalAlpha = 0.85; ctx.textAlign = 'center'; setFont(11, 700); spaced(1);
      const label = player.name || 'P' + (player.id || 1);
      ctx.fillText(player === myPlayer() ? label + ' / YOU' : label, dp.x, dp.y - dp.r - 19);

    ctx.shadowColor = bloomEnabled ? color : 'transparent'; ctx.shadowBlur = bloomEnabled ? 20 : 0;

  function drawHpRing() { drawHpRingFor(P, '#ffffff'); }
  function drawHpRingFor(player, color) {

    ctx.strokeStyle = 'rgba(255,255,255,.14)';

      ctx.restore();

    ctx.strokeStyle = 'rgba(255,255,255,.12)';

    }

  }

  function drawFx() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      const k = p.life / p.max;
      ctx.globalAlpha = Math.max(0, k);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + 0.6 * k), 0, TAU); ctx.fill();
    }
    for (const r of rings) {
      ctx.globalAlpha = Math.max(0, r.life / r.max);
      ctx.strokeStyle = r.color; ctx.lineWidth = r.lw * (r.life / r.max + 0.3);
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    }
    ctx.restore();
    ctx.textAlign = 'center';
    for (const t of texts) {
      setFont(t.size || 15, 700);
      ctx.globalAlpha = Math.max(0, t.life / t.max);
      ctx.fillStyle = t.color; ctx.fillText(t.str, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawHud() {
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left'; ctx.fillStyle = C.fg; setFont(18, 700); spaced(3);
    ctx.fillText('WAVE ' + wave, 24, 38);
    if (phaseCount > 1) {
      const ww = ctx.measureText('WAVE ' + wave).width;
      spaced(2); ctx.fillStyle = C.muted; setFont(13, 700);
      ctx.fillText('PHASE ' + (phaseIdx + 1) + '/' + phaseCount, 24 + ww + 16, 38);
    }
    spaced(0);
    ctx.fillStyle = C.muted; setFont(13, 500);
    ctx.textAlign = 'right'; ctx.fillStyle = C.enemy; setFont(18, 700); spaced(2);
    const remain = enemies.length + spawns.length;
    const cnt = {}; let kind = 'tri', kn = 0;                       // 最も多い敵の種類
    for (const e of enemies) cnt[e.type] = (cnt[e.type] || 0) + 1;
    for (const sp of spawns) cnt[sp.type] = (cnt[sp.type] || 0) + 1;
    for (const k in cnt) if (cnt[k] > kn) { kn = cnt[k]; kind = k; }
    const kt = ET[kind];
    ctx.fillStyle = kt.color;
    ctx.fillText(String(remain), W - 24, 38);
    const ix = W - 24 - ctx.measureText(String(remain)).width - 18, iy = 31;
    ctx.save(); ctx.fillStyle = kt.color; ctx.shadowColor = kt.color; ctx.shadowBlur = 8;
    if (kt.star) drawStar(ix, iy, 11, -Math.PI / 2, 0.36);
    else if (kt.cross) drawCross(ix, iy, 9, 0);
    else drawPoly(ix, iy, 10, kind === 'sq' ? Math.PI / 4 : -Math.PI / 2, kt.sides);
    ctx.fill(); ctx.restore();
    spaced(0); ctx.fillStyle = C.muted; setFont(13, 500);
    const hpLine = visiblePlayers().map((pl) => 'P' + (pl.id || 1) + ' ' + Math.ceil(pl.hp)).join('   ');
    ctx.fillText(hpLine, W - 24, 58);
    const boss = enemies.find((e) => ET[e.type].boss);
    if (boss) {
      let ratio = Math.max(0, boss.hp / boss.maxHp);
      if (boss.type === 'train') { let sum = 0; for (const e of enemies) if (e.type === 'train') sum += Math.max(0, e.hp); ratio = Math.min(1, sum / boss.maxTotal); }
      const bw = 380, bx = (W - bw) / 2, by = 30;
      ctx.textAlign = 'center'; ctx.fillStyle = ET[boss.type].color; setFont(12, 700); spaced(5);
      ctx.fillText(ET[boss.type].name, W / 2 + 2, 22); spaced(0);
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(bx, by, bw, 8);
      ctx.fillStyle = ET[boss.type].color; ctx.fillRect(bx, by, bw * ratio, 8);
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(bx + bw / 2 - 1, by - 2, 2, 12);
    }
  }

  function drawBanner() {

        if (b.owner !== playerId) continue;
        b.px = b.x; b.py = b.y; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
        for (const e of enemies) if (e.hp > 0 && bodyHit(e, b.x, b.y, e.r * 0.9 * (ET[e.type].hk || 1) + b.r)) {
          b.hit ||= new Set();
          if (!b.hit.has(e.id)) {
            b.hit.add(e.id);
            if (netSocket && netSocket.connected) netSocket.emit('bullet-hit', { bulletId: String(b.id || uid++), enemyId: e.id || 0, damage: b.dmg, kb: b.kb, vx: b.vx, vy: b.vy, x: b.x, y: b.y });
          }
          bullets.splice(i, 1); break;
        }
        if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) bullets.splice(i, 1);
      }
      for (let i = ebullets.length - 1; i >= 0; i--) {
        const b = ebullets[i];
        if (Math.hypot(b.x - g.x, b.y - g.y) < b.r + g.r && g.inv <= 0) {
          if (netSocket && netSocket.connected) netSocket.emit('enemy-bullet-hit', { bulletId: i, fromX: b.x - b.vx * 0.1, fromY: b.y - b.vy * 0.1 });
          g.hp = Math.max(0, g.hp - (b.dmg || 10)); g.inv = 0.75;
          burst(g.x, g.y, 10, '#ff7a86', 220, 0.35, 2.5); ebullets.splice(i, 1);
        }
      }
    } else g.dashT = 0;
    guestDash = false;
  }
  function sendLocalInput(now) {
    if (!netSocket || !netSocket.connected || now - lastInputAt < 25) return;
    lastInputAt = now;
    const g = remotePlayer;
    if (!g) return;
    netSocket.volatile.emit('input', {
      x: r1(g.x), y: r1(g.y), aimX: r1(mouse.x), aimY: r1(mouse.y), cursorX: r1(mouse.x), cursorY: r1(mouse.y),
      firing: mouse.down && (state === 'play' || state === 'clear') && g.hp > 0,
      dashT: r2(g.dashT), dashCd: r2(g.dashCd)
    });
  }
  function guestUpdate(dt) {
    guestBuild();
    updateGuestPlayer(dt);
    if (state === 'upgrade') upT += dt; else if (state === 'over') overT += dt;
    if (P.dashT > 0 && trailEnabled) parts.push({ x: P.x, y: P.y, vx: 0, vy: 0, life: 0.25, max: 0.25, size: P.r * 0.7, color: P.color });
    updateFx(dt);
    sendLocalInput(performance.now());
  }
  function readPlayerName() {
    const field = document.getElementById('playerName');
    playerName = (field && field.value.trim().slice(0, 16)) || 'P' + playerId;
    if (P) P.name = playerName;
  }
  document.getElementById('playerName').addEventListener('change', readPlayerName);
  document.getElementById('soloStart').addEventListener('click', () => { readPlayerName(); initAudio(); startGame(); });
  document.getElementById('dashModeSelect').addEventListener('change', (event) => { dashMode = event.target.value === 'move' ? 'move' : 'mouse'; });
  document.getElementById('bloomToggle').addEventListener('change', (event) => { bloomEnabled = event.target.checked; try { localStorage.setItem('td-bloom', bloomEnabled ? '1' : '0'); } catch (_) {} });
  document.getElementById('trailToggle').addEventListener('change', (event) => { trailEnabled = event.target.checked; try { localStorage.setItem('td-trails', trailEnabled ? '1' : '0'); } catch (_) {} });
  try { bloomEnabled = localStorage.getItem('td-bloom') !== '0'; trailEnabled = localStorage.getItem('td-trails') !== '0'; } catch (_) {}
  document.getElementById('bloomToggle').checked = bloomEnabled;
  document.getElementById('trailToggle').checked = trailEnabled;
  document.getElementById('createRoom').addEventListener('click', () => { readPlayerName(); createOnlineRoom(); });
  document.getElementById('joinRoom').addEventListener('click', () => { readPlayerName(); joinOnlineRoom(); });
  document.getElementById('startRoom').addEventListener('click', () => { if (netRole === 'host' && roomRoster.length > 1) { initAudio(); startGame(); } });
  document.getElementById('leaveRoom').addEventListener('click', () => {
    if (netSocket) netSocket.disconnect();
    netSocket = null; netRole = 'solo'; playerId = 1; netRoom = ''; peerConnected = false;
    roomRoster = [{ playerId: 1, isHost: true }]; remotePlayers = new Map(); remoteInputs = new Map(); remoteCursors = new Map();
    showMainMenu(); setNetStatus('ソロプレイ / オンライン接続待機中');
  });

  /* ---------- main loop ---------- */
  let last = performance.now();
  function frame(now) {
    let dt = Math.min(0.05, (now - last) / 1000); last = now;

    // update
    if (netRole === 'guest') {
      time += dt;
      guestUpdate(dt);                 // 受信スナップショットの補間描画 + 自機のローカル移動 + 演出イベントの再生
    } else {
      time += state === 'title' || state === 'upgrade' || state === 'over' ? dt : 0;
      if (state === 'play' || state === 'clear') {
        updateWorld(dt, true);
        if (state === 'clear') {
          clearT -= dt;
          if (clearT <= 0) { state = 'upgrade'; bullets.length = 0; upT = 0; mouse.down = false; startUpgrade(); }
        }
      } else if (state === 'dying') {
        const sd = dt * 0.35;
        updateWorld(sd, false);
        dyT -= dt;
        if (dyT <= 0) { state = 'over'; overT = 0; mouse.down = false; }
      } else if (state === 'upgrade') {
        upT += dt; checkUpgradeDone();
      } else if (state === 'over') {
        overT += dt;
      }
      updateFx(state === 'dying' ? dt * 0.5 : dt);
      if (netRole === 'host' && state === 'play' && performance.now() - lastNetSend >= SNAP_MS) sendSnapshot();
    }
    bannerT = Math.max(0, bannerT - dt);

    // draw
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.lineCap = 'butt';
    drawBackground();
    ctx.save();
    if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
    drawSpawns(); drawMeteors(); drawTrainZones(); drawEnemies(); drawTrainCharge(); drawItems(); drawLasers(); drawBullets(); drawEBullets(); drawPlayer(); drawCursors(); drawFx();
    ctx.restore();

    if (hurtFlash > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.85);
      g.addColorStop(0, 'rgba(255,40,70,0)'); g.addColorStop(1, 'rgba(255,40,70,' + 0.5 * hurtFlash + ')');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (pickFlash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + 0.18 * pickFlash + ')'; ctx.fillRect(0, 0, W, H); }

    if (state !== 'title') drawHud();
    drawBanner();
    if (state === 'upgrade') drawUpgrade();
    if (state === 'over') drawOver();
    if (state === 'title') drawTitle();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
